name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:package
      - run: git diff --exit-code -- dist
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global @openai/codex@0.166.0
      - run: npm run build
      - run: npm run test:native
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check --no-build --all-systems
      - run: nix flake check --print-build-logs
      - run: nix develop -c npm ci --include=dev --no-audit --no-fund
      - run: nix develop -c npm run verify
      - run: nix develop -c npm run test:native
      - run: nix develop -c npm run test:package
      - run: git diff --exit-code -- flake.lock package-lock.json dist
